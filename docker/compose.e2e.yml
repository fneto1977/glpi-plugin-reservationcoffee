# Local homologation / E2E stack for the reservationcoffee plugin.
# Usage: docker compose --env-file .env -f docker/compose.e2e.yml up -d --wait
name: reservationcoffee-e2e

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${E2E_DB_ROOT_PASSWORD:?set E2E_DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: ${E2E_DB_PASSWORD:?set E2E_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  glpi:
    # Supported range starts at 11.0.4; CI runs both 11.0.4 and 11.0.11.
    image: glpi/glpi:${E2E_GLPI_VERSION:-11.0.11}
    depends_on:
      db:
        condition: service_healthy
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: ${E2E_DB_PASSWORD:?set E2E_DB_PASSWORD in .env}
      TZ: ${E2E_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - glpi-data:/var/glpi
      # E2E_PLUGIN_DIR lets tools/homologate-package.sh mount the extracted release package instead.
      - ${E2E_PLUGIN_DIR:-../reservationcoffee}:/var/www/glpi/plugins/reservationcoffee:ro
      - ../tools:/opt/reservationcoffee-tools:ro
      - ./php-timezone.ini:/usr/local/etc/php/conf.d/zz-timezone.ini:ro
    ports:
      - "127.0.0.1:${E2E_HTTP_PORT:-8080}:80"
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/\") === false ? 1 : 0);'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  db-data:
  glpi-data:

networks:
  internal:
    internal: true
  public:
