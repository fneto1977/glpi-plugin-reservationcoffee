name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GLPI_VERSION: 11.0.11
  GLPI_MIN_VERSION: 11.0.4

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: reservationcoffee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: composer lint

      - name: Download GLPI ${{ env.GLPI_VERSION }} for static analysis
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o glpi.tgz "https://github.com/glpi-project/glpi/releases/download/${GLPI_VERSION}/glpi-${GLPI_VERSION}.tgz"
          tar -xzf glpi.tgz
          echo "GLPI_SOURCE_DIR=${RUNNER_TEMP}/glpi" >> "$GITHUB_ENV"

      - name: PHPStan
        run: composer phpstan -- --no-progress

      - name: PHPStan against the minimum supported GLPI (${{ env.GLPI_MIN_VERSION }})
        if: matrix.php == '8.2'
        run: |
          mkdir -p "${RUNNER_TEMP}/glpi-min"
          curl -fsSL "https://github.com/glpi-project/glpi/releases/download/${GLPI_MIN_VERSION}/glpi-${GLPI_MIN_VERSION}.tgz" | tar -xz -C "${RUNNER_TEMP}/glpi-min"
          GLPI_SOURCE_DIR="${RUNNER_TEMP}/glpi-min/glpi" composer phpstan -- --no-progress

      - name: Coding style
        if: matrix.php == '8.2'
        run: composer cs

      - name: Unit tests
        run: composer test

      - name: Dependency audit
        run: composer audit --no-interaction

  locales:
    name: Locales
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext
      - name: Every string is translated and compiles
        run: tools/update-locales.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (GLPI ${{ matrix.glpi }})
    needs: [php, locales]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        glpi: ['11.0.4', '11.0.11']
    env:
      E2E_GLPI_VERSION: ${{ matrix.glpi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Start GLPI stack, install plugin and seed
        run: |
          tools/init-env.sh
          tools/e2e-up.sh

      - name: Integration tests (inside GLPI)
        run: tools/integration-test.sh

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: e2e
        run: npx playwright test

      - name: GLPI logs
        if: failure()
        run: docker compose --env-file .env -f docker/compose.e2e.yml exec -T glpi sh -c 'tail -n 200 /var/glpi/logs/*.log'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-glpi-${{ matrix.glpi }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
